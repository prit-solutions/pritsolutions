<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360">
  <defs>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a2f50"/>
      <stop offset="100%" style="stop-color:#0d1b2e"/>
    </linearGradient>
    <linearGradient id="accentBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4f8ef7"/>
      <stop offset="100%" style="stop-color:#246bce"/>
    </linearGradient>
    <linearGradient id="accentGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2ecc71"/>
      <stop offset="100%" style="stop-color:#1a9b55"/>
    </linearGradient>
    <linearGradient id="accentOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f39c12"/>
      <stop offset="100%" style="stop-color:#d68910"/>
    </linearGradient>
    <linearGradient id="rocketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#d0e4ff"/>
    </linearGradient>
    <filter id="cardShadow">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="rgba(0,0,0,0.25)"/>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="rocketShadow">
      <feDropShadow dx="2" dy="4" stdDeviation="5" flood-color="rgba(79,142,247,0.4)"/>
    </filter>
  </defs>

  <!-- Fondo transparente para que tome el color de la sección -->
  <rect width="480" height="360" fill="none"/>

  <!-- ===== MONITOR / PANTALLA PRINCIPAL ===== -->
  <!-- Base del monitor -->
  <rect x="70" y="180" width="60" height="10" rx="4" fill="rgba(255,255,255,0.15)"/>
  <rect x="90" y="165" width="20" height="20" rx="2" fill="rgba(255,255,255,0.12)"/>
  <!-- Cuerpo del monitor -->
  <rect x="30" y="55" width="260" height="160" rx="14" fill="url(#screenGrad)" filter="url(#cardShadow)"/>
  <rect x="30" y="55" width="260" height="160" rx="14" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
  <!-- Barra de título del editor -->
  <rect x="30" y="55" width="260" height="28" rx="14" fill="rgba(255,255,255,0.06)"/>
  <rect x="30" y="69" width="260" height="14" fill="rgba(255,255,255,0.06)"/>
  <!-- Puntos de la barra de título -->
  <circle cx="52" cy="69" r="5" fill="#e74c3c" opacity="0.8"/>
  <circle cx="68" cy="69" r="5" fill="#f39c12" opacity="0.8"/>
  <circle cx="84" cy="69" r="5" fill="#2ecc71" opacity="0.8"/>
  <!-- Nombre del archivo -->
  <text x="160" y="73" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="rgba(255,255,255,0.4)">prit-solution.jsx</text>

  <!-- ===== CÓDIGO EN PANTALLA ===== -->
  <!-- Línea 1 -->
  <text x="50" y="101" font-family="'Courier New', monospace" font-size="9.5" fill="#4f8ef7">import</text>
  <text x="93" y="101" font-family="'Courier New', monospace" font-size="9.5" fill="#ffffff"> Solution </text>
  <text x="138" y="101" font-family="'Courier New', monospace" font-size="9.5" fill="#4f8ef7">from</text>
  <text x="162" y="101" font-family="'Courier New', monospace" font-size="9.5" fill="#2ecc71"> 'prit'</text>
  <!-- Línea 2 -->
  <text x="50" y="116" font-family="'Courier New', monospace" font-size="9.5" fill="#f39c12">function</text>
  <text x="102" y="116" font-family="'Courier New', monospace" font-size="9.5" fill="#ffffff"> App() </text>
  <text x="140" y="116" font-family="'Courier New', monospace" font-size="9.5" fill="#ffffff">{</text>
  <!-- Línea 3 -->
  <text x="66" y="131" font-family="'Courier New', monospace" font-size="9.5" fill="#4f8ef7">  return</text>
  <text x="108" y="131" font-family="'Courier New', monospace" font-size="9.5" fill="#ffffff"> (</text>
  <!-- Línea 4 - barra de progreso animada -->
  <rect x="66" y="137" width="180" height="8" rx="4" fill="rgba(255,255,255,0.06)"/>
  <rect x="66" y="137" width="130" height="8" rx="4" fill="url(#accentBlue)" opacity="0.7"/>
  <!-- Línea 5 -->
  <text x="66" y="158" font-family="'Courier New', monospace" font-size="9.5" fill="#9b59b6">  &lt;Solution</text>
  <text x="128" y="158" font-family="'Courier New', monospace" font-size="9.5" fill="#2ecc71"> build</text>
  <text x="164" y="158" font-family="'Courier New', monospace" font-size="9.5" fill="#ffffff">=</text>
  <text x="170" y="158" font-family="'Courier New', monospace" font-size="9.5" fill="#f39c12">"true"</text>
  <text x="208" y="158" font-family="'Courier New', monospace" font-size="9.5" fill="#9b59b6">/&gt;</text>
  <!-- Línea 6 - cursor -->
  <rect x="50" y="170" width="8" height="12" rx="1" fill="#4f8ef7" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0;0.9" dur="1.2s" repeatCount="indefinite"/>
  </rect>
  <text x="60" y="181" font-family="'Courier New', monospace" font-size="9.5" fill="rgba(255,255,255,0.3)">}</text>

  <!-- ===== TARJETA: COMPONENTE UI (flotante arriba-derecha) ===== -->
  <g transform="translate(310, 40)">
    <rect width="148" height="90" rx="12" fill="white" filter="url(#cardShadow)"/>
    <rect width="148" height="28" rx="12" fill="url(#accentBlue)"/>
    <rect y="14" width="148" height="14" fill="url(#accentBlue)"/>
    <text x="74" y="19" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="700" fill="white">Componente listo ✓</text>
    <!-- Barra de progreso -->
    <rect x="14" y="38" width="120" height="6" rx="3" fill="#eef2ff"/>
    <rect x="14" y="38" width="96" height="6" rx="3" fill="url(#accentBlue)"/>
    <text x="74" y="34" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="8" fill="#888">Progreso del build</text>
    <text x="137" y="48" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="8" font-weight="700" fill="#246bce">80%</text>
    <!-- Tags -->
    <rect x="14" y="52" width="34" height="14" rx="7" fill="#eef9f4"/>
    <text x="31" y="63" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="8" fill="#1a9b55" font-weight="600">React</text>
    <rect x="54" y="52" width="34" height="14" rx="7" fill="#fef6e4"/>
    <text x="71" y="63" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="8" fill="#d68910" font-weight="600">Node</text>
    <rect x="94" y="52" width="40" height="14" rx="7" fill="#f0eeff"/>
    <text x="114" y="63" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="8" fill="#6e3080" font-weight="600">Python</text>
    <!-- Divider -->
    <line x1="14" y1="74" x2="134" y2="74" stroke="#eee" stroke-width="1"/>
    <text x="14" y="85" font-family="'Segoe UI', Arial, sans-serif" font-size="8" fill="#aaa">PRIT Solutions ©</text>
    <circle cx="132" cy="82" r="6" fill="url(#accentGreen)"/>
    <text x="132" y="86" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="white">✓</text>
  </g>

  <!-- ===== TARJETA: MÉTRICAS (flotante abajo-derecha) ===== -->
  <g transform="translate(318, 168)">
    <rect width="140" height="78" rx="12" fill="white" filter="url(#cardShadow)"/>
    <text x="14" y="20" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="700" fill="#1a2f50">Proyectos activos</text>
    <!-- Stat 1 -->
    <text x="14" y="40" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="800" fill="#246bce">98%</text>
    <text x="60" y="40" font-family="'Segoe UI', Arial, sans-serif" font-size="8" fill="#888">satisfacción</text>
    <!-- Mini barras -->
    <rect x="14" y="50" width="112" height="5" rx="2" fill="#eef2ff"/>
    <rect x="14" y="50" width="100" height="5" rx="2" fill="url(#accentBlue)" opacity="0.7"/>
    <!-- Stat 2 -->
    <text x="14" y="68" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#2ecc71" font-weight="700">+120 soluciones</text>
    <text x="100" y="68" font-family="'Segoe UI', Arial, sans-serif" font-size="8" fill="#aaa">entregadas</text>
  </g>

  <!-- ===== COHETE (elemento central de crecimiento) ===== -->
  <g transform="translate(390, 270) rotate(-35)" filter="url(#rocketShadow)">
    <!-- Llama del cohete -->
    <ellipse cx="0" cy="38" rx="8" ry="14" fill="#f39c12" opacity="0.9"/>
    <ellipse cx="0" cy="42" rx="5" ry="10" fill="#e74c3c" opacity="0.8"/>
    <!-- Cuerpo principal -->
    <path d="M-12,30 Q-12,-5 0,-22 Q12,-5 12,30 Z" fill="url(#rocketGrad)"/>
    <!-- Ventana -->
    <circle cx="0" cy="4" r="6" fill="url(#accentBlue)" opacity="0.9"/>
    <circle cx="0" cy="4" r="3" fill="rgba(255,255,255,0.6)"/>
    <!-- Aletas -->
    <path d="M-12,20 L-22,32 L-12,28 Z" fill="rgba(255,255,255,0.7)"/>
    <path d="M12,20 L22,32 L12,28 Z" fill="rgba(255,255,255,0.7)"/>
  </g>

  <!-- ===== ESTELAS / TRAYECTORIA ===== -->
  <path d="M415,310 Q430,270 445,230" stroke="rgba(79,142,247,0.4)" stroke-width="2" stroke-dasharray="5,4" fill="none"/>
  <path d="M410,315 Q425,280 440,245" stroke="rgba(79,142,247,0.2)" stroke-width="1.5" stroke-dasharray="3,5" fill="none"/>

  <!-- ===== NODOS DE RED (colaboración) ===== -->
  <!-- Nodo colaboración 1 -->
  <circle cx="42" cy="280" r="18" fill="url(#accentGreen)" opacity="0.9" filter="url(#softGlow)"/>
  <text x="42" y="276" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="white">👥</text>
  <text x="42" y="306" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="8" fill="rgba(255,255,255,0.7)">Equipo</text>
  <!-- Línea conexión -->
  <line x1="60" y1="280" x2="90" y2="250" stroke="rgba(46,204,113,0.4)" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Nodo colaboración 2 -->
  <circle cx="115" cy="255" r="13" fill="url(#accentOrange)" opacity="0.85" filter="url(#softGlow)"/>
  <text x="115" y="259" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="white">💡</text>
  <text x="115" y="278" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="8" fill="rgba(255,255,255,0.7)">Ideas</text>
  <!-- Línea conexión -->
  <line x1="122" y1="248" x2="140" y2="230" stroke="rgba(243,156,18,0.4)" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Nodo colaboración 3 -->
  <circle cx="42" cy="330" r="13" fill="url(#accentBlue)" opacity="0.85" filter="url(#softGlow)"/>
  <text x="42" y="334" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="white">🚀</text>
  <text x="42" y="353" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="8" fill="rgba(255,255,255,0.7)">Deploy</text>

  <!-- Línea entre nodos -->
  <line x1="42" y1="298" x2="42" y2="317" stroke="rgba(79,142,247,0.4)" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="55" y1="325" x2="102" y2="262" stroke="rgba(79,142,247,0.25)" stroke-width="1" stroke-dasharray="3,4"/>

  <!-- ===== PARTÍCULAS DECORATIVAS ===== -->
  <circle cx="290" cy="35" r="3" fill="#4f8ef7" opacity="0.6"/>
  <circle cx="270" cy="20" r="2" fill="#2ecc71" opacity="0.5"/>
  <circle cx="310" cy="25" r="2" fill="#f39c12" opacity="0.5"/>
  <circle cx="460" cy="155" r="3" fill="#4f8ef7" opacity="0.4"/>
  <circle cx="468" cy="170" r="2" fill="#2ecc71" opacity="0.4"/>
  <circle cx="172" cy="295" r="2.5" fill="#9b59b6" opacity="0.5"/>
  <circle cx="190" cy="310" r="1.5" fill="#4f8ef7" opacity="0.4"/>

  <!-- Líneas flotantes decorativas -->
  <line x1="260" y1="18" x2="300" y2="18" stroke="rgba(79,142,247,0.3)" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="455" y1="148" x2="475" y2="148" stroke="rgba(46,204,113,0.3)" stroke-width="1.5" stroke-dasharray="3,3"/>
</svg>
